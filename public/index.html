      <style>
    /* ── Devanagari (Hindi) typography ──────────────────────────
       Matras akshar ke upar-neeche jaati hain — default line-height me
       kat jaati hain. Aur Latin font stack me Devanagari face hota hi
       nahi, to browser koi bhi fallback utha leta hai.
       Ye rule sirf tab lagta hai jab user ne Hindi chuni ho, aur sirf
       un elements par jinki apni line-height nahi hai. */
    html[lang="hi"] {
      font-family: "Noto Sans Devanagari", "Nirmala UI", "Mangal",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    html[lang="hi"] input,
    html[lang="hi"] textarea,
    html[lang="hi"] select,
    html[lang="hi"] button {
      font-family: inherit;
    }
    </style>
  </head>

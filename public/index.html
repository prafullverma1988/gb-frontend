<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="description" content="Sanchalan — Construction Management Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sanchalan" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="%PUBLIC_URL%/icon-192.png" />
    <title>Sanchalan</title>
      <style>
    /* ── Devanagari (Hindi) typography ──────────────────────────
       Matras akshar ke upar-neeche jaati hain — default line-height me
       kat jaati hain. Aur Latin font stack me Devanagari face hota hi
       nahi, to browser koi bhi fallback utha leta hai.
       Ye rule sirf tab lagta hai jab user ne Hindi chuni ho, aur sirf
       un elements par jinki apni line-height nahi hai. */
    html[lang="hi"] {
      font-family: "Noto Sans Devanagari", "Nirmala UI", "Mangal",
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    /* ── Devanagari: chhote font aur tight line-height ka farsh ──────
       Naap (Noto Sans Devanagari): ink-height font-size ka 1.25–1.47 guna hai,
       jabki Latin ka ~1.0. Matlab jo Hinglish me theek dikhta hai wo Hindi me
       toot jaata hai — 9.5px par matra padhi hi nahi jaati, aur lineHeight:1
       par upar-neeche ki matras takrati hain.

       Code me 713 aisi jagah thi. Har jagah badalne ke bajaye yahan farsh laga
       diya: React inline style ko `style="font-size: 9.5px;"` likhta hai, aur
       ye selector use override kar deta hai. Hinglish/English ka layout bilkul
       nahi badalta — rule sirf html[lang="hi"] par lagti hai.

       Naap ke mutabik farsh: font 11px (wahan ink ratio 1.27 hai), line 1.3.
       Selector me space+semicolon zaroori hai — "font-size: 9.5px;" likhne se
       "font-size: 19.5px;" match NAHI hota.

       10px/10.5px jaan-boojh kar chhode hain: wahan ~2,500 jagah hain aur
       Devanagari us size par padhne layak hai. Badalna ho to neeche do line
       jod do. */
    html[lang="hi"] [style*="font-size: 6px;"],
    html[lang="hi"] [style*="font-size: 7px;"],
    html[lang="hi"] [style*="font-size: 7.5px;"],
    html[lang="hi"] [style*="font-size: 8px;"],
    html[lang="hi"] [style*="font-size: 8.5px;"],
    html[lang="hi"] [style*="font-size: 9px;"],
    html[lang="hi"] [style*="font-size: 9.5px;"] {
      font-size: 11px !important;
    }
    html[lang="hi"] [style*="line-height: 1;"],
    html[lang="hi"] [style*="line-height: 1.05;"],
    html[lang="hi"] [style*="line-height: 1.1;"],
    html[lang="hi"] [style*="line-height: 1.15;"] {
      line-height: 1.3 !important;
    }

    html[lang="hi"] input,
    html[lang="hi"] textarea,
    html[lang="hi"] select,
    html[lang="hi"] button {
      font-family: inherit;
    }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
